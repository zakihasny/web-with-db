services:
  mysql:
    image: mysql:8.4
    container_name: testing-employee-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: testing_employee_db
    ports:
      - "3306:3306"
    volumes:
      - employee_mysql_data:/var/lib/mysql
      - ./database/sample_employee_database.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/002_local_users.sql:/docker-entrypoint-initdb.d/002_local_users.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal_root_password"]
      interval: 8s
      timeout: 4s
      retries: 12

volumes:
  employee_mysql_data:
